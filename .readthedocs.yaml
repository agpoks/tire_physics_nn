version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: docs/requirements.txt

# The project itself is deliberately NOT installed: the API reference is produced by
# sphinx-autoapi via static analysis of tire_nn/, and every figure is pre-generated by
# docs/generate_figures.py and committed. The docs build therefore needs neither torch
# nor any training run.
