# Experiment 3 — four-wheel, vehicle-supervised learning (PLAN.md §5).
#
# Train a tire model from IMU-level signals only (ax, ay, yaw acceleration, wheel
# speeds, steering, velocity) through the exact Newton-Euler equations, then test on a
# friction level and tire set that were never trained on.

experiment: exp3_vehicle
seed: 0
device: cpu
out_dir: results/exp3

vehicle:                 # exact geometry — never learned
  m: 1200.0
  Iz: 1500.0
  lf: 1.3
  lr: 1.4
  t_f: 1.6
  t_r: 1.6
  h_cg: 0.45
  R_e: 0.32

data:
  source: synthetic
  n_sequences: 8
  T: 1200
  dt: 0.005
  mu_train: [1.0, 0.85]
  mu_test: [0.65]            # unseen friction condition
  tire_ids: [soft, medium]
  noise_imu: 0.05
  split: [0.75, 0.25, 0.0]   # test comes from the held-out friction level

training:
  epochs: 150
  batch_size: 512
  lr: 0.003
  patience: 40
  loss_weights: [1.0, 1.0, 1.0]      # ax, ay, r_dot

models:
  analytical:  {}                              # fitted Magic Formula, no learning
  shared:      {tire: encoded, share_tire: true}
  per_wheel:   {tire: encoded, share_tire: false}   # ablation: 4 independent nets
  parameter:   {tire: parameter, share_tire: true}

evaluation:
  pretrain_with_tire_data: true   # optional warm start from direct force data
  pretrain_epochs: 40
